name = "jev-aitools-fyi"
compatibility_date = "2024-09-23"

# Cloudflare Pages (git-connected) looks at this:
pages_build_output_dir = "dist"

# So `npx wrangler deploy` / Workers static assets also works:
[assets]
directory = "./dist"
not_found_handling = "404-page"
# Pages git deploy: use repo-root `functions/` + dist/_routes.json (see README).
# Do not set run_worker_first here without a Worker `main` script and assets.binding.

[vars]
PUBLIC_SITE_URL = "https://jev.aitools.fyi"
# PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN = "" # Set in Cloudflare Pages project env vars, not here
